name: Build DarkDev iOS Executor

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Theos Environment
        run: |
          echo "Setting up Theos for iOS Tweak Compilation..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          
      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/* ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile Dylib / Executor
        run: |
          export THEOS=~/theos
          make clean package FINALPACKAGE=1

      - name: Upload Built Dylib Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DarkDevExecutor-iOS
          path: packages/*.deb
