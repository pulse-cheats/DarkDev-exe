name: Build DarkDev iOS Executor

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Signing Tools (ldid)
        run: |
          brew install ldid

      - name: Setup Theos Environment
        run: |
          echo "Setting up Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKEFILES_DIR=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/* ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile Dylib / Executor
        run: |
          export THEOS=$HOME/theos
          export THEOS_MAKEFILES_DIR=$HOME/theos/makefiles
          make clean package FINALPACKAGE=1

      - name: Upload Built Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkDevExecutor-iOS
          path: packages/*.deb
